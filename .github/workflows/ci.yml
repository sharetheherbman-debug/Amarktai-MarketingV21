name: CI/CD Pipeline

on:
  push:
    branches: [master, development, phase-1/small-medium-completion, rescue/client-handover-marketing-2026-08-24, rescue/client-dashboard-2026-08-25, release-candidate/marketing-client-handover-2026-08-24]
  pull_request:
    branches: [master, development, phase-1/small-medium-completion, rescue/client-handover-marketing-2026-08-24, rescue/client-dashboard-2026-08-25, release-candidate/marketing-client-handover-2026-08-24]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lockfile:
    name: Refresh Secure Lockfile
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Upgrade patched direct dependencies
        run: |
          npm install --workspace=@amarktai/web next@15.5.22 eslint-config-next@15.5.22 --save-exact --package-lock-only --ignore-scripts
          npm install --workspace=@amarktai/api uuid@11.1.1 multer@2.2.0 @types/multer@2.2.0 --save-exact --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts
      - name: Commit secure manifests and lockfile when changed
        run: |
          if git diff --quiet -- package.json package-lock.json apps/web/package.json apps/api/package.json; then
            echo "Dependency graph already matches patched manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json apps/api/package.json
          git commit -m "fix(deps): refresh patched production dependencies"
          git push origin HEAD:${{ github.head_ref }}

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check API TypeScript
        run: cd apps/api && npx tsc --noEmit
      - name: Check Web TypeScript
        run: cd apps/web && npx tsc --noEmit
      - name: Build reusable Application Connector SDK
        run: npm run build --workspace=@amarktai/application-connector-sdk

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build API
        run: cd apps/api && npm run build
      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_MARKETING_BRAND_NAME: CI Marketing
          NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION: CI white-label production build
          NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL: support@example.com
          NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL: /logo.svg
          NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME: CI Host
          NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR: '#123456'
          NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR: '#abcdef'
        run: cd apps/web && npm run build
      - name: Verify AmarktAI, EquiProfile and third-tenant white-label builds
        run: npm run test:white-label-build
      - name: Build reusable Application Connector SDK
        run: npm run build --workspace=@amarktai/application-connector-sdk

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for codec-level acceptance
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run API tests
        run: cd apps/api && npm test -- --runInBand --detectOpenHandles

  migrations:
    name: Fresh and Production-History Migration Acceptance
    runs-on: ubuntu-latest
    needs: typescript
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amarktai
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarktai -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      MIGRATION_FRESH_DATABASE_URL: postgresql://amarktai:test-password@localhost:5432/amarktai_migration_acceptance_fresh
      MIGRATION_UPGRADE_DATABASE_URL: postgresql://amarktai:test-password@localhost:5432/amarktai_migration_acceptance_upgrade
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build API
        run: cd apps/api && npm run build
      - name: Copy all SQL migrations
        run: mkdir -p apps/api/dist/db && cp -R apps/api/src/db/migrations apps/api/dist/db/migrations
      - name: Create isolated acceptance databases
        run: |
          psql postgresql://amarktai:test-password@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE amarktai_migration_acceptance_fresh'
          psql postgresql://amarktai:test-password@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE amarktai_migration_acceptance_upgrade'
      - name: Verify fresh, idempotent and real post-036 production-history upgrades
        run: npm run test:migrations

  e2e:
    name: Real API, Database and Redis Customer Journey
    runs-on: ubuntu-latest
    needs: typescript
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amarktai
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: amarktai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarktai -d amarktai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://amarktai:test-password@localhost:5432/amarktai_e2e
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: e2e-jwt-secret-that-is-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-that-is-at-least-thirty-two-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000
      CORS_ORIGIN: http://127.0.0.1:3000
      PORT: '4000'
      GENX_API_KEY: e2e-provider-boundary-key
      GENX_BASE_URL: http://127.0.0.1:4100
      DEFAULT_TEXT_MODEL: gpt-5.6-luna
      GENX_PRICE_MAX_AGE_MINUTES: '720'
      SCHEDULER_ENABLED: 'false'
      RATE_LIMIT_MAX_REQUESTS: '1000'
      FIRST_RUN: 'false'
      MARKETING_CREDIT_SALES_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_MARKETING_BRAND_NAME: Acceptance Marketing
      NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION: Acceptance customer journey build
      NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL: support@example.test
      NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL: /logo.svg
      NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME: Acceptance Host
      NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR: '#123456'
      NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR: '#abcdef'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for the real customer journey
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build API and copy migrations
        run: |
          npm run build --workspace=@amarktai/api
          mkdir -p apps/api/dist/db
          cp -R apps/api/src/db/migrations apps/api/dist/db/migrations
      - name: Migrate and seed the disposable real database
        run: |
          node apps/api/dist/db/migrate.js
          node scripts/e2e-seed.mjs
      - name: Build the acceptance white-label web app
        env:
          NODE_ENV: production
        run: npm run build --workspace=@amarktai/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real customer journey
        run: npm run test:e2e
      - name: Preserve customer-journey diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-customer-journey-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    env:
      DOMAIN: marketing.example.com
      TLS_EMAIL: ci@example.com
      APP_URL: https://marketing.example.com
      API_URL: https://marketing.example.com/api
      CORS_ORIGIN: https://marketing.example.com
      POSTGRES_PASSWORD: docker-postgres-password-long-enough
      REDIS_PASSWORD: docker-redis-password-long-enough
      JWT_SECRET: docker-jwt-secret-that-is-not-a-default
      JWT_REFRESH_SECRET: docker-refresh-secret-that-is-not-a-default
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GENX_API_KEY: docker-placeholder-genx-key
      GENX_WEBHOOK_SECRET: docker-webhook-secret-that-is-long-enough
      GENX_WEBHOOK_URL: https://marketing.example.com/api/v1/webhooks/genx
      GENX_FX_RATES_TO_GBP: '{"USD":0.79,"EUR":0.86}'
      SMTP_FROM: CI Marketing <noreply@example.com>
      APPLICATION_CONNECTOR_SIGNING_SECRET: docker-connector-signing-secret-that-is-long-enough
      HOST_APP_CONNECTOR_KEY: docker-host-connector-key-that-is-long-enough
      HOST_APP_ID: ci-host
      HOST_APP_NAME: CI Host Application
      HOST_APP_URL: https://app.example.com
      FIRST_RUN: 'false'
      NEXT_PUBLIC_MARKETING_BRAND_NAME: CI Marketing
      NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION: CI white-label Docker build
      NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL: support@example.com
      NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL: /logo.svg
      NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME: CI Host
      NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR: '#123456'
      NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR: '#abcdef'
    steps:
      - uses: actions/checkout@v5
      - name: Validate VPS shell scripts
        run: bash -n scripts/vps-*.sh scripts/lib/vps-common.sh
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e DOMAIN="${DOMAIN}"
          -e TLS_EMAIL="${TLS_EMAIL}"
          -v "${PWD}/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.9-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          --add-host web:127.0.0.1
          --add-host api:127.0.0.1
          -v "${PWD}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t amarktai-api:test .
      - name: Build generation worker Docker image
        run: docker build -f apps/api/Dockerfile -t amarktai-generation-worker:test .
      - name: Build long-form still worker Docker image
        run: docker build -f apps/api/Dockerfile -t amarktai-longform-still-worker:test .
      - name: Build render worker Docker image
        run: docker build -f apps/api/Dockerfile.render -t amarktai-render-worker:test .
      - name: Build Web Docker image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=/api
          --build-arg "NEXT_PUBLIC_MARKETING_BRAND_NAME=${NEXT_PUBLIC_MARKETING_BRAND_NAME}"
          --build-arg "NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION=${NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION}"
          --build-arg "NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL=${NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL}"
          --build-arg "NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL=${NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL}"
          --build-arg "NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME=${NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME}"
          --build-arg "NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR=${NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR}"
          --build-arg "NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR=${NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR}"
          -f apps/web/Dockerfile -t amarktai-web:test .
      - name: Validate base Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Validate HTTPS production Compose configuration
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.production.yml config --quiet

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

  verify:
    name: Verification Suite
    runs-on: ubuntu-latest
    needs: [build, test, migrations, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run verification
        run: node scripts/verify.js

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [verify, docker, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get version
        id: version
        run: echo "version=$(node -p \"require('./version.json').version\")" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
