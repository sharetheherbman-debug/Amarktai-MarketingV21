services:
  caddy:
    image: caddy:2.9-alpine
    container_name: amarktai-caddy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - amarktai-network

volumes:
  caddy_data:
  caddy_config:
