name: ${COMPOSE_PROJECT_NAME:-amarktai-marketing}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  networks:
    - amarktai-network

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-marketing}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-marketing}
  POSTGRES_USER: ${POSTGRES_USER:-marketing}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
  POSTGRES_DB: ${POSTGRES_DB:-marketing}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
  GENX_API_KEY: ${GENX_API_KEY:?GENX_API_KEY required}
  GENX_BASE_URL: ${GENX_BASE_URL:-https://query.genx.sh}
  GENX_WEBHOOK_SECRET: ${GENX_WEBHOOK_SECRET:?GENX_WEBHOOK_SECRET required}
  GENX_WEBHOOK_URL: ${GENX_WEBHOOK_URL:?GENX_WEBHOOK_URL required}
  DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL:-gpt-5.6-luna}
  GENX_AGENT_TIER_ENABLED: ${GENX_AGENT_TIER_ENABLED:-true}
  GENX_TARGET_MARGIN_BPS: ${GENX_TARGET_MARGIN_BPS:-4000}
  GENX_RESERVATION_BUFFER_BPS: ${GENX_RESERVATION_BUFFER_BPS:-1500}
  GENX_PRICE_REFRESH_MINUTES: ${GENX_PRICE_REFRESH_MINUTES:-360}
  GENX_PRICE_MAX_AGE_MINUTES: ${GENX_PRICE_MAX_AGE_MINUTES:-720}
  GENX_PRICING_SOURCE_CURRENCY: ${GENX_PRICING_SOURCE_CURRENCY:-USD}
  GENX_PROVIDER_CREDITS_PER_USD: ${GENX_PROVIDER_CREDITS_PER_USD:-100}
  GENX_FX_RATES_TO_GBP: ${GENX_FX_RATES_TO_GBP:?GENX_FX_RATES_TO_GBP required}
  GENERATION_RESERVATION_TTL_MINUTES: ${GENERATION_RESERVATION_TTL_MINUTES:-60}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
  OPENVERSE_CLIENT_ID: ${OPENVERSE_CLIENT_ID:-}
  OPENVERSE_CLIENT_SECRET: ${OPENVERSE_CLIENT_SECRET:-}
  BILLING_CURRENCY: ${BILLING_CURRENCY:-GBP}
  GENERATION_CREDITS_PER_GBP: ${GENERATION_CREDITS_PER_GBP:-100}
  LOCAL_EMBEDDINGS_ENABLED: ${LOCAL_EMBEDDINGS_ENABLED:-true}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  MARKETING_CREDIT_SALES_ENABLED: ${MARKETING_CREDIT_SALES_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM required}
  APPLICATION_CONNECTOR_SIGNING_SECRET: ${APPLICATION_CONNECTOR_SIGNING_SECRET:?APPLICATION_CONNECTOR_SIGNING_SECRET required}
  HOST_APP_CONNECTOR_KEY: ${HOST_APP_CONNECTOR_KEY:-}
  HOST_APP_ID: ${HOST_APP_ID:-}
  HOST_APP_NAME: ${HOST_APP_NAME:-}
  HOST_APP_URL: ${HOST_APP_URL:-}
  EQUIPROFILE_CONNECTOR_KEY: ${EQUIPROFILE_CONNECTOR_KEY:-}
  EQUIPROFILE_APP_ID: ${EQUIPROFILE_APP_ID:-}
  EQUIPROFILE_APP_NAME: ${EQUIPROFILE_APP_NAME:-}
  EQUIPROFILE_APP_URL: ${EQUIPROFILE_APP_URL:-}
  APPLICATION_CONNECTOR_MAX_CLOCK_SKEW_SECONDS: ${APPLICATION_CONNECTOR_MAX_CLOCK_SKEW_SECONDS:-300}
  APPLICATION_SSO_CODE_TTL_SECONDS: ${APPLICATION_SSO_CODE_TTL_SECONDS:-120}
  APP_URL: ${APP_URL:?APP_URL required}
  API_URL: ${API_URL:?API_URL required}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
  HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-3000}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
  FIRST_RUN: ${FIRST_RUN:-false}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing} -d ${POSTGRES_DB:-marketing}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      PORT: "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s
    stop_grace_period: 35s

  generation-worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/workers/generation-worker.js"]
    environment:
      <<: *api-environment
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-2}
      GENX_REQUESTS_PER_MINUTE: ${GENX_REQUESTS_PER_MINUTE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          found=0; for cmd in /proc/[0-9]*/cmdline; do grep -aq 'generation-worker.js' "$$cmd" && found=1 && break; done;
          [ "$$found" -eq 1 ] &&
          node -e "const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{connectTimeout:2000,maxRetriesPerRequest:1});r.ping().then(v=>{r.disconnect();process.exit(v==='PONG'?0:1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 35s

  longform-still-worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/workers/longform-still-worker.js"]
    environment:
      <<: *api-environment
      LONGFORM_STILL_WORKER_CONCURRENCY: ${LONGFORM_STILL_WORKER_CONCURRENCY:-1}
      GENX_REQUESTS_PER_MINUTE: ${GENX_REQUESTS_PER_MINUTE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          found=0; for cmd in /proc/[0-9]*/cmdline; do grep -aq 'longform-still-worker.js' "$$cmd" && found=1 && break; done;
          [ "$$found" -eq 1 ] &&
          node -e "const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{connectTimeout:2000,maxRetriesPerRequest:1});r.ping().then(v=>{r.disconnect();process.exit(v==='PONG'?0:1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s

  render-worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.render
    environment:
      <<: *api-environment
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          found=0; for cmd in /proc/[0-9]*/cmdline; do grep -aq 'render-worker.js' "$$cmd" && found=1 && break; done;
          [ "$$found" -eq 1 ] &&
          node -e "const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{connectTimeout:2000,maxRetriesPerRequest:1});r.ping().then(v=>{r.disconnect();process.exit(v==='PONG'?0:1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s

  web:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_MARKETING_PUBLIC_URL: ${NEXT_PUBLIC_MARKETING_PUBLIC_URL:-https://marketing.amarktai.co.za}
        NEXT_PUBLIC_MARKETING_BRAND_NAME: ${NEXT_PUBLIC_MARKETING_BRAND_NAME:-Marketing Workspace}
        NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION: ${NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION:-AI-powered marketing automation, analytics, campaign management and growth operations.}
        NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL: ${NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL: ${NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL:-/logo.svg}
        NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME: ${NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME:-Host application}
        NEXT_PUBLIC_MARKETING_EMBEDDED_SSO_ONLY: ${NEXT_PUBLIC_MARKETING_EMBEDDED_SSO_ONLY:-false}
        NEXT_PUBLIC_MARKETING_HOST_RETURN_URL: ${NEXT_PUBLIC_MARKETING_HOST_RETURN_URL:-https://amarktai.co.za}
        NEXT_PUBLIC_AMARKTAI_NETWORK_URL: ${NEXT_PUBLIC_AMARKTAI_NETWORK_URL:-https://amarktai.co.za}
        NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR: ${NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR:-#052b57}
        NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR: ${NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR:-#167cc1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_MARKETING_PUBLIC_URL: ${NEXT_PUBLIC_MARKETING_PUBLIC_URL:-https://marketing.amarktai.co.za}
      NEXT_PUBLIC_MARKETING_BRAND_NAME: ${NEXT_PUBLIC_MARKETING_BRAND_NAME:-Marketing Workspace}
      NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION: ${NEXT_PUBLIC_MARKETING_BRAND_DESCRIPTION:-AI-powered marketing automation, analytics, campaign management and growth operations.}
      NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL: ${NEXT_PUBLIC_MARKETING_SUPPORT_EMAIL:-}
      NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL: ${NEXT_PUBLIC_MARKETING_BRAND_LOGO_URL:-/logo.svg}
      NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME: ${NEXT_PUBLIC_MARKETING_HOST_APPLICATION_NAME:-Host application}
      NEXT_PUBLIC_MARKETING_EMBEDDED_SSO_ONLY: ${NEXT_PUBLIC_MARKETING_EMBEDDED_SSO_ONLY:-false}
      NEXT_PUBLIC_MARKETING_HOST_RETURN_URL: ${NEXT_PUBLIC_MARKETING_HOST_RETURN_URL:-https://amarktai.co.za}
      NEXT_PUBLIC_AMARKTAI_NETWORK_URL: ${NEXT_PUBLIC_AMARKTAI_NETWORK_URL:-https://amarktai.co.za}
      NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR: ${NEXT_PUBLIC_MARKETING_BRAND_PRIMARY_COLOR:-#052b57}
      NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR: ${NEXT_PUBLIC_MARKETING_BRAND_ACCENT_COLOR:-#167cc1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_MARKETING_BRAND_NAME:-Marketing Workspace}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    <<: *service-defaults
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/ready"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data:
  studio_uploads:

networks:
  amarktai-network:
    driver: bridge
