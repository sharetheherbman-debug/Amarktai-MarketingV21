version: "3.9"

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-amarktai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-amarktai_marketing}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
  GENX_API_KEY: ${GENX_API_KEY:?GENX_API_KEY required}
  GENX_BASE_URL: ${GENX_BASE_URL:-https://query.genx.sh}
  GENX_WEBHOOK_SECRET: ${GENX_WEBHOOK_SECRET:-}
  GENX_WEBHOOK_URL: ${GENX_WEBHOOK_URL:-}
  APP_URL: ${APP_URL:-http://localhost}
  API_URL: ${API_URL:-http://localhost/api}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amarktai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amarktai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-amarktai_marketing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amarktai} -d ${POSTGRES_DB:-amarktai_marketing}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [amarktai-network]

  redis:
    image: redis:7-alpine
    container_name: amarktai-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [amarktai-network]

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [amarktai-network]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: amarktai-api
    restart: unless-stopped
    environment:
      <<: *api-environment
      PORT: "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [amarktai-network]

  generation-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: amarktai-generation-worker
    restart: unless-stopped
    command: ["node", "dist/workers/generation-worker.js"]
    environment:
      <<: *api-environment
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-2}
      GENX_REQUESTS_PER_MINUTE: ${GENX_REQUESTS_PER_MINUTE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [amarktai-network]

  render-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.render
    container_name: amarktai-render-worker
    restart: unless-stopped
    environment:
      <<: *api-environment
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - studio_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [amarktai-network]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: amarktai-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [amarktai-network]

  nginx:
    image: nginx:alpine
    container_name: amarktai-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [amarktai-network]

volumes:
  postgres_data:
  redis_data:
  studio_uploads:

networks:
  amarktai-network:
    driver: bridge
