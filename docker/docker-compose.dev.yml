version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: amarktai-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-amarktai_marketing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-amarktai_marketing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - amarktai-network

  redis:
    image: redis:7-alpine
    container_name: amarktai-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devpassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amarktai-network

volumes:
  postgres_data:
    name: amarktai-postgres-data-dev
  redis_data:
    name: amarktai-redis-data-dev

networks:
  amarktai-network:
    driver: bridge
    name: amarktai-network-dev
